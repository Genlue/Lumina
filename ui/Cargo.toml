[package]
name = "lumina-ui"
version = "4.0.0"
edition = "2021"
description = "Lumina 前端渲染层（Leptos CSR + GlassDesign）"

[dependencies]
# 三个都必须声明：`#[component]` / `view!` 展开成 `::leptos::…` 绝对路径，
# `#[wasm_bindgen]` 展开成 `::wasm_bindgen::…`，都指向本 crate 根的外部 crate。
# 别写 `=0.8.x` 精确锁 —— 库用 caret，锁死会各拿一份 leptos，Signal 变成两个类型。
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
# 0.8.1 起：覆盖式滚动条由库自己挂（ScrollArea / NavColumn），滑块拖拽不再被
# 按压过渡缓动，`Row` 有 `wide` 开关。这三条以前是在 app.css 里打补丁绕过的。
# 0.8.2 是打包修复（模板清单改名 .liquid，首次拉取不再刷两行包名错误）；
# 0.8.3 修 0.8.1 引入的回归：滑块拇指与进度条脱节。
glass-design = { git = "https://github.com/Genlue/GlassDesign", tag = "v0.8.3" }

wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "DomRect",
]

[lib]
crate-type = ["cdylib", "rlib"]

# wasm 体积优先：release 走尺寸优化，链接时再剥一次。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
