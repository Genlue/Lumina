[package]
name = "lumina-ui"
version = "4.2.0"
edition = "2021"
description = "Lumina 前端渲染层（Leptos CSR + GlassDesign）"

[dependencies]
# 三个都必须声明：`#[component]` / `view!` 展开成 `::leptos::…` 绝对路径，
# `#[wasm_bindgen]` 展开成 `::wasm_bindgen::…`，都指向本 crate 根的外部 crate。
# 别写 `=0.8.x` 精确锁 —— 库用 caret，锁死会各拿一份 leptos，Signal 变成两个类型。
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
# 依赖直接认上游仓库的 tag，不在本仓库留副本：
# 升级＝改这一行的 tag → `cargo update -p glass-design` → 提交 Cargo.lock。
# 0.10.0 起有文档级「玻璃效果」三档（Auto / Blur / Solid），由安装期的
# `restore_effects_preference` 恢复，选择存 localStorage（键 glass-design:effects）。
# 0.8.1 起覆盖式滚动条由库自己挂、`Row` 有 `wide`；0.8.3 修滑块拇指与填充脱节。
glass-design = { git = "https://github.com/Genlue/GlassDesign", tag = "v0.10.0" }

wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "WheelEvent",
  "PointerEvent",
  "HtmlImageElement",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "DomRect",
]

[lib]
crate-type = ["cdylib", "rlib"]

# wasm 体积优先：release 走尺寸优化，链接时再剥一次。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
