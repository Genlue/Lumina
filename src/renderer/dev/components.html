<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina · 控件库</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/layout.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  /* 仅用于演示页自身的框架，不属于控件库 */
  body { background: var(--surface-window); }
  /* 悬浮导航栏形态：内容整幅铺开（不切壁纸缝），让位交给滚动容器的内边距。
     满幅横幅 / hero 再把这段内边距抵消掉 —— 它们在顶部，药丸在中间，不相遇。
     停靠边不同，让位的边也不同。 */
  .demo-app[data-navform="dock"][data-dock-edge="left"] .demo-stage,
  .demo-app[data-navform="dock"][data-dock-edge="left"] .tune-stage {
    padding-left: calc(var(--dock-gutter) + 12px);
  }
  .demo-app[data-navform="dock"][data-dock-edge="left"] .demo-banner,
  .demo-app[data-navform="dock"][data-dock-edge="left"] .tune-hero {
    margin-left: calc(-1 * (var(--dock-gutter) + 12px));
  }
  .demo-app[data-navform="dock"][data-dock-edge="right"] .demo-stage,
  .demo-app[data-navform="dock"][data-dock-edge="right"] .tune-stage {
    padding-right: calc(var(--dock-gutter) + 12px);
  }
  /* 右侧停靠时波浪条整体左移，否则药丸压在它上面 */
  .demo-app[data-navform="dock"][data-dock-edge="right"] .c-wave {
    right: calc(16px + var(--dock-gutter));
  }
  .demo-app[data-navform="dock"][data-dock-edge="bottom"] .demo-stage,
  .demo-app[data-navform="dock"][data-dock-edge="bottom"] .tune-stage {
    padding-bottom: calc(var(--dock-gutter) + 40px);
  }

  .demo-app {
    position: absolute;
    inset: 12px;
    display: grid;
    /* 导航栏宽度只由 --nav-w 决定：换形态就是换这一个数。
       两栏的排布不在这里写 —— 导航栏是覆盖层，内容列靠 .l-main 的
       margin-left 让位，见 styles/layout.css。 */
    --nav-w: 210px;
    grid-template-rows: minmax(0, 1fr);
    border-radius: var(--r-window);
    overflow: hidden;
    background: transparent;
    box-shadow: var(--shadow-window);
  }
  /* 模块之间的间距由 .l-nav__body 统一给，这里不再自带 gap */
  .demo-nav { display: contents; }
  .demo-side {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: inset -0.5px 0 0 var(--line-soft);
  }
  .demo-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 52px;
    padding: 0 14px;
    flex: none;
  }
  .demo-brand__mark {
    width: 22px; height: 22px;
    border-radius: 7px;
    background: linear-gradient(150deg, #ffce7a, #e2705a 55%, #6f4a86);
    box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.35);
  }
  .demo-brand__name { font-size: 13px; font-weight: 500; }
  .demo-brand__ver { font-size: 11px; color: var(--text-tertiary); margin-left: auto; }
  .demo-side__nav { flex: 1; min-height: 0; overflow: hidden auto; padding-bottom: 12px; }
  .demo-side__pages { flex: none; padding-top: 4px; }

  /* 真分页：右侧同一时刻只挂一个页面，各自记住自己的滚动位置 */
  .demo-pages { position: absolute; inset: 0; }
  .demo-page { position: absolute; inset: 0; display: none; }
  .demo-page[data-active="1"] { display: block; }

  /* 开了波浪条的页面，正文右侧要让出 40px 给横条，否则会被压住 */
  .demo-main[data-wave="1"] .demo-stage,
  .demo-main[data-wave="1"] .tune-stage { padding-right: 58px; }

  /* ---- 玻璃参数面板（嵌在第二个页面里）---- */
  .tune-stage {
    position: absolute;
    inset: 0;
    overflow: hidden auto;
    padding: 0 30px 90px;
    overscroll-behavior: contain;
  }
  /* 满幅 hero：渐变一直顶到窗口上沿，工具栏浮在它上面 ——
     这样顶栏那几颗胶囊是压在渐变上的，玻璃立刻看得见 */
  .tune-hero {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 0 -30px 30px;
    padding: 92px 30px 22px;
    background: linear-gradient(112deg, #3f4a86 0%, #5b3a72 34%, #a84a5c 62%, #e08a4e 84%, #f3bd7c 100%);
  }
  .tune-hero .tune-head { margin-bottom: 16px; }
  /* 这一段压在深色渐变上，不能用 --text-glass-*（浅色主题下它们是深色） */
  .tune-hero .tune-head__title { color: #fff; }
  .tune-hero .tune-head__desc { color: rgb(255 255 255 / 0.82); }
  .tune-hero .tune-note { color: rgb(255 255 255 / 0.7); }
  /* 只作用于「玻璃面选择器」这一条，别写到整个 hero 上 ——
     预览胶囊里也有 .c-seg，宽选择器会把它的内件顶到顶部 */
  .tune-tabs .c-seg { align-self: flex-start; background: rgb(0 0 0 / 0.26); }
  .tune-tabs .c-seg__opt { color: rgb(255 255 255 / 0.92); }
  .tune-tabs { display: flex; }
  .tune-sec { margin-bottom: 38px; }
  .tune-sec__title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.012em;
    margin-bottom: 3px;
  }
  .tune-sec__desc { font-size: 12px; color: var(--text-tertiary); margin-bottom: 16px; max-width: 64ch; }
  .tune-note {
    font: 11px/1.5 ui-monospace, "SF Mono", monospace;
    color: var(--text-secondary);
  }
  .tune-params {
    display: grid;
    gap: 2px;
    padding: 14px 16px;
    border-radius: var(--r-md);
    background: var(--surface-well);
  }
  .tune-toast { position: static !important; }
  .tune-head { margin-bottom: 26px; }
  .tune-head__title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.016em;
    margin-bottom: 4px;
  }
  .tune-head__desc { font-size: 12px; color: var(--text-tertiary); max-width: 62ch; }

  .tune-card { margin-bottom: 30px; }
  .tune-card__top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .tune-card__name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .tune-card__cls {
    font: 11px/1.4 ui-monospace, "SF Mono", monospace;
    padding: 2px 6px;
    border-radius: var(--r-xs);
    color: var(--text-secondary);
    background: var(--surface-control);
  }
  .tune-card__note { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; }

  /* 预览台本身不再自带背景：它现在站在 hero 的渐变上 */
  .tune-stage--sample {
    display: grid;
    place-items: center;
    min-height: 120px;
    padding: 18px 0 4px;
  }
  .tune-sample { width: 100%; border-radius: var(--r-md); padding: 14px 16px; }
  .tune-sample__name { font-size: 13px; font-weight: 500; color: var(--text-glass-1); }
  .tune-sample__spec { font-size: 11px; color: var(--text-glass-3); margin-top: 3px; }
  /* 预览里的菜单：菜单本体是 position:fixed，这里放回文档流；
     但它是个 block，不写宽度会撑满整条预览带 */
  /* 注意别用 position: static —— 渲染层的画布是 absolute; inset:0，
     宿主一旦是 static，画布就会按最近的定位祖先铺开（表现：糊满整条预览带）。
     relative 既把它放回文档流，又给画布一个定位基准。 */
  .tune-menu { position: relative; z-index: 0; width: 230px; }
  /* 模态在真实界面里是居中的一块，不是满幅 */
  .tune-sample--card { max-width: 380px; }

  .tune-row {
    display: grid;
    grid-template-columns: 168px minmax(80px, 1fr) 62px;
    align-items: center;
    gap: 12px;
    padding: 3px 0;
  }
  .tune-row > * { min-width: 0; }
  .tune-row__label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .tune-row__out {
    font-size: 12px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .tune-row[data-unavailable="1"] .tune-row__label,
  .tune-row[data-unavailable="1"] .tune-row__out { color: var(--text-quaternary); }
  .tune-row[data-dirty="1"] .tune-row__label { color: var(--accent); }
  .tune-row[data-dirty="1"] .tune-row__out { color: var(--accent); }
  .tune-mode { margin: 2px 0 6px; }
  .tune-preview {
    position: relative;
    overflow: hidden;
    border-radius: var(--r-md);
    background: #b8c0cc;
  }
  .tune-preview__grid {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 12px;
    pointer-events: none;
    color: #111827;
    background-color: #d7dde5;
    background-image:
      linear-gradient(#64748b 1px, transparent 1px),
      linear-gradient(90deg, #64748b 1px, transparent 1px),
      linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
    background-size: 20px 20px, 20px 20px, 100% 100%;
    font: 700 15px/1.45 ui-monospace, "SF Mono", monospace;
    letter-spacing: 0.04em;
    text-shadow: 0 1px #fff;
  }
  .tune-preview__grid span { max-width: 32ch; }
  .tune-preview .tune-stage--sample {
    position: relative;
    z-index: 1;
    min-height: 148px;
    padding: 22px 16px;
  }
  .tune-mode {
    font: 11px/1.5 ui-monospace, "SF Mono", monospace;
    color: rgb(255 255 255 / 0.76);
    margin: 0 0 6px;
  }
  .tune-mode[data-mode="fallback"] { color: #ffe08a; }
  .tune-json {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    padding: 12px 14px;
    border: 0.5px solid var(--line-soft);
    border-radius: var(--r-sm);
    background: var(--surface-well);
    color: var(--text-primary);
    font: 11px/1.55 ui-monospace, "SF Mono", monospace;
    tab-size: 2;
  }
  .tune-json--readonly { min-height: 220px; color: var(--text-secondary); }
  .tune-export-title { font-size: 12px; color: var(--text-secondary); }

  .tune-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0.5px solid var(--line-soft);
  }
  .tune-foot__spacer { flex: 1; }

  .tune-out {
    font: 11px/1.65 ui-monospace, "SF Mono", monospace;
    color: var(--text-secondary);
    background: var(--surface-well);
    border-radius: var(--r-sm);
    padding: 14px 16px;
    margin: 0;
    max-height: 420px;
    overflow: auto;
    white-space: pre;
    tab-size: 2;
  }
  /* 内容从窗口顶部就铺 —— 不再留那 52px 的「让壁纸透上来」。
     那一条是旧渲染层的补丁：它采不到内容，只好让顶栏压在壁纸上，
     于是渐进模糊糊的一直是壁纸。现在工具栏下面就是内容本身。 */
  .demo-main {
    position: relative;
    min-width: 0;
    overflow: hidden;
    background: var(--surface-content);
  }
  /* 满幅横幅：顶到窗口上沿，工具栏浮在它上面。
     这样「渐进模糊」糊的是这块真实内容，胶囊折射的也是它。 */
  .demo-banner {
    margin: -84px -30px 34px;
    padding: 92px 30px 26px;
    background: linear-gradient(112deg, #3f4a86 0%, #5b3a72 34%, #a84a5c 62%, #e08a4e 84%, #f3bd7c 100%);
  }
  .demo-main[data-wave="1"] .demo-banner { margin-right: -58px; }
  .demo-banner__title {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 500; letter-spacing: -0.016em;
    color: #fff; margin-bottom: 4px;
  }
  .demo-banner__desc { font-size: 12px; color: rgb(255 255 255 / 0.82); max-width: 62ch; }
  .demo-stage {
    position: absolute;
    inset: 0;
    overflow: hidden auto;
    padding: 84px 30px 70px;
    overscroll-behavior: contain;
  }
  .demo-sec { margin-bottom: 42px; }
  .demo-sec__title {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.014em;
    margin-bottom: 3px;
  }
  .demo-sec__desc b {
    font-weight: 600;
    color: var(--text-primary);
  }
  .demo-sec__desc { font-size: 12px; color: var(--text-tertiary); margin-bottom: 16px; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px 22px; }
  .demo-cell { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .demo-cell > .c-seg { align-self: flex-start; }
  /* 行内控件在纵向 flex 里会被拉满一行，显式收回到内容宽度 */
  .demo-cell > .c-badge,
  .demo-cell > .c-chip,
  .demo-cell > .c-tabs { align-self: flex-start; }
  .demo-cap { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.02em; }
  .demo-code {
    font: 11px/1.4 ui-monospace, "SF Mono", monospace;
    padding: 2px 6px;
    border-radius: var(--r-xs);
    color: var(--text-secondary);
    background: var(--surface-control);
  }
  .demo-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .demo-glassstage {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    padding: 18px;
    border-radius: var(--r-lg);
    background: linear-gradient(112deg, #3f4a86 0%, #5b3a72 34%, #a84a5c 62%, #e08a4e 84%, #f3bd7c 100%);
  }
  .demo-glasscard__name { font-size: 13px; font-weight: 500; color: var(--text-glass-1); }
  .demo-glasscard__spec { font-size: 11px; color: var(--text-glass-3); margin-top: 3px; }
  /* 四块材质样张只用组件的材质管线，页面不再自己写一套，
     这样调液态玻璃参数时它们和顶栏胶囊完全同步 */
  .demo-glassstage .c-glass-chrome,
  .demo-glassstage .c-acrylic,
  .demo-glassstage .c-glass-sheet {
    border-radius: var(--r-md);
    padding: 14px;
    height: auto;
  }
  .demo-thumbs { display: grid; grid-template-columns: repeat(4, 104px); gap: 8px; }
  .demo-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; max-width: 560px; }

  /* 导航形态样张：铺在同一块渐变上，玻璃才有东西可透 */
  .demo-navstage {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(196px, 1fr));
    align-items: start;
    gap: 16px;
    padding: 18px;
    border-radius: var(--r-lg);
    background: linear-gradient(112deg, #3f4a86 0%, #5b3a72 34%, #a84a5c 62%, #e08a4e 84%, #f3bd7c 100%);
  }
  .demo-navstage .demo-cap { color: rgb(255 255 255 / 0.82); }
  .demo-navcell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  /* 悬浮导航样张：一块假窗口，药丸浮在内容上 —— 玻璃得有东西可透才看得出是玻璃 */
  .demo-dockrow {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  .demo-dockcell { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .demo-dockstage {
    position: relative;
    height: 380px;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: linear-gradient(112deg, #3f4a86 0%, #5b3a72 34%, #a84a5c 62%, #e08a4e 84%, #f3bd7c 100%);
  }
  .demo-dockmock {
    position: absolute;
    inset: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .demo-dockmock > span {
    display: block;
    border-radius: 10px;
    background: rgb(255 255 255 / 0.16);
    box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.18);
  }
  .demo-dockmock > span:nth-child(1) { height: 54px; }
  .demo-dockmock > span:nth-child(2) { height: 88px; }
  .demo-dockmock > span:nth-child(3) { height: 40px; width: 62%; }
  .demo-dockmock > span:nth-child(4) { height: 40px; width: 78%; }
  .demo-dockmock > span:nth-child(5) { height: 40px; width: 54%; }

  .demo-navcell > .l-nav {
    border-radius: var(--r-md);
    max-height: 268px;
    overflow: hidden;
    /* 样张铺在渐变上，acrylic 只有一条右边线，四角读不出来 —— 这里补一圈 */
    box-shadow: inset 0 0 0 0.5px var(--line-strong);
  }
  .demo-navcell .c-nav { padding-bottom: var(--s-4); }
  .demo-navtop {
    padding: 8px 12px;
    border-radius: var(--r-md);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
  }

  /* 窄窗与 125%/150% 缩放：先收侧栏，再把参数标签移到轨道上方。 */
  @media (max-width: 700px) {
    /* 窄窗不再收成图标轨道 —— 导航栏要么在，要么整根收起 */
    .demo-app { inset: 6px; }
    .demo-app > .l-nav { display: none; }
    .demo-app > .l-main { margin-left: 0; }
    .demo-stage, .tune-stage { padding-left: 16px; padding-right: 16px; }
    .demo-main[data-wave="1"] .demo-stage,
    .demo-main[data-wave="1"] .tune-stage { padding-right: 48px; }
    .demo-banner { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
    .demo-main[data-wave="1"] .demo-banner { margin-right: -48px; }
    .tune-hero { margin-left: -16px; margin-right: -16px; padding: 82px 16px 18px; }
    .tune-tabs { overflow-x: auto; padding-bottom: 4px; }
    .tune-row {
      grid-template-columns: minmax(80px, 1fr) 62px;
      gap: 3px 10px;
      padding: 7px 0;
    }
    .tune-row__label { grid-column: 1 / -1; white-space: normal; }
    .tune-params { padding: 10px 12px; }
    .tune-foot { flex-wrap: wrap; }
    .tune-foot__spacer { display: none; }
  }
</style>
</head>
<body>
<div id="wallpaper"></div>
<div class="l-app demo-app" id="app"></div>

<script type="module">
import { icon } from '../scripts/core/icons.js';
import { h } from '../scripts/core/dom.js';
import { theme, GLASS_SURFACES } from '../scripts/core/theme.js';
import { mountGlassSurfaces, supportsNativeGlass } from '../scripts/core/glass-lens.js';
import { GLASS_PARAM_DEFS } from '../scripts/core/glass-schema.js';
import { revealOnScroll } from '../scripts/core/scrollbar.js';
import { isDesktop, currentBackdrop } from '../scripts/core/platform.js';
import {
  Button, IconButton, Segmented, Switch, Slider, Field, SearchField, Select,
  Checkbox, RadioGroup, Card, CardGroup, Row, SectionTitle, Divider,
  NavItem, NavGroup, NavSection, NavCard, NavColumn, NavSearch, NavInfo, SectionWave,
  NavDock, NavDockItem, NavDockSep,
  MediaTile, Tile, Thumb, Badge, Empty, Spinner, Progress, ProgressRing, Skeleton,
  List, ListRow, ListHeader, Table, Tabs, TextArea, Stepper, Avatar, Chip,
  Disclosure, Breadcrumb, Dialog, confirmDialog, openPopover, closePopover, tip,
  Toolbar, ToolbarTitle, openMenu, toast,
  Swatches, Capsule, TopVeil, TrafficLights, NavPair, disposeComponentTree, markNavMoving,
} from '../scripts/ui/kit.js';

const root = document.documentElement;
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
theme.init();
document.documentElement.dataset.focused = '1';
const paramTheme = params.get('theme');
if (paramTheme === 'dark' || paramTheme === 'light') theme.setMode(paramTheme, { persist: false });

/* ---------------- 占位照片 ---------------- */
const photo = (a, b, seed = 0) =>
  `data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/>
      </linearGradient></defs>
      <rect width="200" height="200" fill="url(#g)"/>
      <circle cx="${120 + seed * 12}" cy="${64 - seed * 6}" r="36" fill="rgba(255,255,255,.16)"/>
      <path d="M0 150 Q 60 ${110 + seed * 8} 110 148 T 200 140 V200 H0 Z" fill="rgba(0,0,0,.18)"/>
    </svg>`
  )}`;

/* ---------------- 侧栏 ---------------- */
const sections = [

/* ---------------- 分页 + 页内波浪条 ----------------

   侧栏只放"页面级"导航：实心 pill，点了右侧整页换掉。
   页内目录不占侧栏 —— 连续页的目录挂在右侧滚动条左边，是一排横条，
   当前那根放大并把邻近的挤开，形成波浪（见 SectionWave）。
   -------------------------------------------------------------------------- */

// 真分页：点了右侧整页换掉。导航栏只建一次，切换页面只改 aria-selected。
let sideEl = null;

const PAGES = [
  {
    id: 'components', label: '控件陈列', icon: 'square-pen',
    title: '控件陈列', subtitle: '54 个控件',
    wave: true,     // 连续页，开波浪条
    sections: sections.map(([id, label, , group]) => ({ id, label, group })),
  },
  {
    id: 'optics', label: '参数', icon: 'sliders',
    title: '参数', subtitle: '七块玻璃，各调各的',
    wave: false,    // 参数页是一整页，不分节
    sections: [],
  },
];

// 每个页面一个容器，同一时刻只挂一个，各自记住滚动位置
const pageEls = new Map();
const pagesHost = h('div', { class: 'demo-pages' });
for (const p of PAGES) {
  const el = h('div', { class: 'demo-page', dataset: { page: p.id } });
  pageEls.set(p.id, el);
  pagesHost.append(el);
}

let activePage = PAGES[0].id;

/** 点击后这段时间内，滚动联动不接管高亮 —— 否则平滑滚动途中会被沿途分区抢走 */
let navLockUntil = 0;
const NAV_LOCK_MS = 700;

const wave = SectionWave({
  onPick: (i) => {
    const page = PAGES.find((p) => p.id === activePage);
    const s = page?.sections[i];
    if (!s) return;
    navLockUntil = performance.now() + NAV_LOCK_MS;
    wave.setCurrent(i);
    document.getElementById(`sec-${s.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
});

/** 判定线：分区顶边越过这条线就算"当前" */
const SPIKE = 140;

/** 按当前滚动位置反推该高亮第几根横条 —— 换页回来时要接上，不能重置成第一节 */
const pickIndex = (page) => {
  let idx = 0;
  page.sections.forEach((s, i) => {
    const el = document.getElementById(`sec-${s.id}`);
    if (el && el.getBoundingClientRect().top < SPIKE) idx = i;
  });
  return idx;
};

const activatePage = (id) => {
  const page = PAGES.find((p) => p.id === id);
  if (!page) return;
  activePage = id;
  for (const p of PAGES) {
    pageEls.get(p.id).dataset.active = p.id === id ? '1' : '0';
  }
  // 导航栏可能被重建过，所以按数据属性找，不持有节点引用
  for (const el of navHost.querySelectorAll('[data-page]')) {
    el.setAttribute('aria-selected', String(el.dataset.page === id));
  }
  dockNav?.setSelected(PAGES.findIndex((p) => p.id === id));
  // 目录跟着换页重建，当前横条按该页自己的滚动位置接上
  wave.setItems(page.sections.map((s) => ({ label: s.label })));
  wave.setCurrent(pickIndex(page));
  wave.setEnabled(!!page.wave);
  document.querySelector('.demo-main').dataset.wave = page.wave ? '1' : '0';
  document.querySelector('.c-topbar .c-title').textContent = page.title;
  document.querySelector('.c-topbar .c-subtitle').textContent = page.subtitle;
};

   导航栏里只有四样东西：搜索模块（可选）、信息模块（可选）、列表项、卡片模块。 */

/* ---------------- 导航栏收起 / 展开 ----------------
   收起 = 整根消失，不是收成图标轨道。红绿灯和开关在 .l-chrome 里，位置不动。 */
/* 导航形态：side = 侧边导航栏，dock = 悬浮导航栏。
   两种形态共用同一份 PAGES —— 换的是「怎么排」，不是「有哪些页」。
   悬浮形态下侧边栏永远收着（内容整幅铺开），所以收起态是两个独立的变量，
   切换形态时不能互相污染。 */
let navForm = 'side';
let navHidden = false;   // 侧边形态的收起态
let dockHidden = false;  // 悬浮形态的收起态
let dockNav = null;

function syncNav() {
  app.dataset.navform = navForm;
  app.dataset.dockEdge = dockNav?.dataset.edge || 'left';
  if (dockEdgeCapsule) dockEdgeCapsule.style.display = navForm === 'dock' ? '' : 'none';
  // 开合前先挂覆盖期材质，否则那 380ms 里内容会原样透出来。
  // 只在状态真的变了才挂 —— syncNav 在初始化和换形态时也会被调。
  const wasHidden = app.classList.contains('l-app--nav-hidden');
  const nextHidden = navForm === 'dock' ? true : navHidden;
  if (navForm !== 'dock' && wasHidden !== nextHidden) markNavMoving(app);
  app.classList.toggle('l-app--nav-hidden', nextHidden);
  dockNav?.setHidden(navForm !== 'dock' || dockHidden);
  const btn = app.querySelector('.l-chrome__toggle .c-iconbtn');
  const hidden = navForm === 'dock' ? dockHidden : navHidden;
  if (btn) {
    const label = hidden ? '展开导航栏' : '收起导航栏';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  requestAnimationFrame(() => wave.setCurrent(pickIndex(PAGES.find((p) => p.id === activePage))));
}

function setNavForm(form) {
  navForm = form;
  navFormSeg.set(form);
  if (form === 'side') {
    navHidden = false;
    dockHidden = false;
  }
  syncNav();
}

const toggleNav = () => {
  if (navForm === 'dock') dockHidden = !dockHidden;
  else navHidden = !navHidden;
  syncNav();
};

const fmtParam = (d, v) => `${Number(v).toFixed(d.digits)}${d.unit || ''}`;

/* Acrylic 的三个旋钮：导航栏不是液态玻璃，不该出现折射 / 色散 / 涂层这些项 */
const ACRYLIC_PARAMS = [
  { k: 'tint', label: '浓度', min: 0.2, max: 1, step: 0.01, digits: 2, unit: '', hint: '染色层的不透明度' },
  { k: 'blur', label: '模糊', min: 0, max: 60, step: 1, digits: 0, unit: 'px', hint: '背景模糊半径' },
  { k: 'sat', label: '饱和度', min: 0, max: 2.5, step: 0.05, digits: 2, unit: '×', hint: '提饱和倍数，acrylic 的关键' },
];

function renderAcrylicParams() {
  const raw = theme.acrylic;
  for (const d of ACRYLIC_PARAMS) {
    const out = tuneOut(`${Number(raw[d.k]).toFixed(d.digits)}${d.unit}`);
    const sl = Slider({
      min: d.min, max: d.max, step: d.step, value: raw[d.k],
      onInput: (v) => {
        theme.setAcrylic({ [d.k]: v });
        out.textContent = `${Number(v).toFixed(d.digits)}${d.unit}`;
      },
    });
    paramSliders.set(d.k, { sl, out, d, available: true });
    paramHost.append(h('div', { class: 'tune-row', title: d.hint },
      h('div', { class: 'tune-row__label' }, d.label),
      sl,
      out));
  }
}

function renderParams() {
  // 清空参数区前先释放 slider 的 RO/RAF/lens；参数值仍在 theme 里，不会被 dispose。
  disposeComponentTree(paramHost);
  paramHost.textContent = '';
  paramSliders.clear();
  if (activeSurface === 'panel') {
    renderAcrylicParams();
    return;
  }
  const raw = theme.getOpticsRaw(activeSurface);
  for (const d of PARAMS) {
    const available = nativeCapable || !NATIVE_ONLY_PARAMS.has(d.k);
    const out = tuneOut(fmtParam(d, raw[d.k]));
    // JSON 可以合法导入超出推荐 UI 范围但仍在存储范围内的值；控件要能如实显示它。
    const rangeMin = Math.min(d.min, raw[d.k]);
    const rangeMax = Math.max(d.max, raw[d.k]);
    const sl = Slider({
      min: rangeMin, max: rangeMax, step: d.step, value: raw[d.k],
      onInput: (v) => {
        if (!available) return;
        theme.setOptics(activeSurface, { [d.k]: v });
        out.textContent = fmtParam(d, v);
      },
    });
    const row = h('div', {
      class: 'tune-row',
      dataset: { unavailable: available ? null : '1' },
      title: available ? d.hint : `${d.hint} · 当前 CSS 兜底路径无法真实消费此项`,
    },
      h('div', { class: 'tune-row__label' }, d.label),
      sl,
      out);
    if (!available) {
      const focusable = sl.input || sl;
      focusable.tabIndex = -1;
      focusable.setAttribute('aria-disabled', 'true');
      sl.style.opacity = '0.45';
      sl.style.pointerEvents = 'none';
    }
    paramSliders.set(d.k, { sl, out, d, available });
    paramHost.append(row);
  }
}

/* —— 每页各自绑定：滚动条、末尾预留、波浪条联动 —— */
// 最后几节永远滚不到视口顶部，如果只靠「谁在顶部」判定，它们就永远选不中。
// 与其在滚到底时强行选最后一个（那样倒数第二个又选不中），
// 不如在内容末尾预留一段空间，让每一节都能滚到阈值线以上，各有一条自己的判定带。
const reserveTail = (page) => {
  const lastId = page.sections[page.sections.length - 1]?.id;
  const lastEl = lastId && document.getElementById(`sec-${lastId}`);
  if (!lastEl) return;
  page.stage.style.paddingBottom = '70px';
  const maxScroll = page.stage.scrollHeight - page.stage.clientHeight;
  // 滚到底时让最后一节的顶边停在 24px —— 它就有了自己的判定带
  const need = Math.max(0, lastEl.offsetTop - 24 - maxScroll);
  if (need > 0) page.stage.style.paddingBottom = `${70 + need}px`;
};

const bindPage = (page) => {
  revealOnScroll(page.stage);
  reserveTail(page);
  if (typeof ResizeObserver !== 'undefined') {
    let raf = 0;
    new ResizeObserver(() => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => reserveTail(page));
    }).observe(page.stage);
  }

  page.stage.addEventListener('scroll', () => {
    // 只在当前页联动；程序化滚动期间由点击结果说了算
    if (activePage !== page.id) return;
    if (performance.now() < navLockUntil) return;
    wave.setCurrent(pickIndex(page));
  }, { passive: true });

  // 用户一动手就交还控制权：滚轮、按下、键盘都算接管
  for (const t of ['wheel', 'pointerdown', 'keydown']) {
    page.stage.addEventListener(t, () => { navLockUntil = 0; }, { passive: true });
  }
};

  }, 400);
}

// 支持 ?y=像素 直接滚到指定位置（用于截图核对）
const _y = Number(new URLSearchParams(location.search).get('y') || 0);
if (_y) requestAnimationFrame(() => { PAGES[0].stage.scrollTop = _y; });

// 支持 ?page=optics 直接落在第二页
const _page = params.get('page');
if (_page && PAGES.some((p) => p.id === _page)) activatePage(_page);
</script>
</body>
</html>
