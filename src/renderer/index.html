<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumina</title>
  <link rel="icon" href="./assets/icons/icon-32.png" />

  <!-- 四件套顺序固定：tokens → base → layout → components。app.css 只写页面级布局。 -->
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <!-- 壁纸层：窗口透明，导航栏的 acrylic 后面要透出它 -->
  <div id="wallpaper"></div>

  <!--
    窗口骨架（docs/04 §1）：
      .c-topbar  窗口顶栏 —— 红绿灯 / 收起导航 / 前进后退 + 页面名 / 右侧胶囊
      .l-nav     导航栏（acrylic），覆盖层，不占列；主区靠 margin-left 让位
      .l-main    内容列 —— .l-stage 滚动，.c-topveil 压在上面做渐进模糊
    顶栏与导航栏由 scripts/app/shell.js 构建，这里只留锚点。
  -->
  <div class="l-app" id="app">
    <div class="l-main" id="main">
      <div class="l-stage" id="stage">
        <div class="app-boot" id="boot">
          <span class="c-spinner"></span>
        </div>
      </div>
      <div class="c-topveil" id="topveil"></div>
    </div>
  </div>

  <script type="module">
    import { theme } from './scripts/core/theme.js';

    // ① 必须在建任何 UI 之前：写 data-theme / 强调色 / 玻璃参数 / 阴影系数 / 图标线宽
    theme.init();
    const { boot } = await import('./scripts/app/boot.js');
    boot();
  </script>
</body>
</html>
